[package]
name = "horizon-mod-emojiful-port"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Emoji images and replacement in chat, from asset packs and Twemoji: an exact 1:1 Rust port of Emojiful."

[lib]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
